<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="referrer" content="no-referrer"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#11252a"><meta name="color-scheme" content="dark"><title>TV Box</title><link rel="icon" href="icon-192.png"><link rel="apple-touch-icon" href="icon-192.png"><link rel="manifest" href="manifest.webmanifest"><link rel="stylesheet" href="style.css"><script defer src="vendor/hls.min.js"></script><script defer src="app.js?v=6"></script></head>
<body><main id="library">
<header class="flex items-center justify-between"><div class="brand flex items-center"><span class="brandmark" aria-hidden="true">▶</span>TV Box</div><div class="flex items-center gap-2"><button id="connect">Catalogue</button><button id="install" hidden>Install app</button></div></header>
<section class="shelf"><div class="flex items-end justify-between gap-2"><h1>Channels &amp; films</h1><span id="count" aria-live="polite"></span></div>
<label class="search flex items-center"><span aria-hidden="true">⌕</span><input id="query" type="search" placeholder="Search titles or languages" aria-label="Search titles or languages"></label>
<p id="notice" role="status" hidden></p><div id="list"></div></section></main>
<section id="player" hidden aria-label="Video player"><video id="video" playsinline crossorigin="anonymous"></video><div id="surface"></div>
<div id="top" class="tools flex items-center"><button id="back" aria-label="Back to catalogue">‹ Back</button><strong id="title"></strong><button id="lock">Lock controls</button></div>
<output id="feedback" hidden></output><div id="bottom" class="tools"><input id="seek" type="range" min="0" step=".1" aria-label="Film position" hidden><div class="buttons flex items-center"><button id="play">Play</button><button id="sync"><i></i> Sync live</button><button id="tracks">Audio &amp; subtitles</button><button id="full">Full screen</button></div></div><div id="error" role="status" hidden><p></p><button id="retry">Retry</button></div></section>
<dialog id="settings"><form method="dialog"><h2 id="dialogTitle"></h2><div id="options"></div><button class="done">Done</button></form></dialog>
</body></html>
